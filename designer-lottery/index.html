const PLAIN = ["PNCL","BRSH","PLTE","PNTL","RULR","ERSR","CRSR","SCSR","BCKT","CUP","IDEA"];
const PRIZES = [ // [label, verification word, weight, cash value]
  ["$5","FIVE",20,5],["$10","TEN",16,10],["$20","TWENTY",10,20],["$50","FIFTY",5,50],["$100","ONEHUN",2,100],
  ["FREE FONT","FRFONT",8,0],["1 REVISION","ONEREV",8,0],["DAY OFF","DAYOFF",5,0],["COFFEE","COFFEE",10,0],["UNDO x99","UNDO99",6,0],
];
const rnd = Math.random, pick = a => a[Math.floor(rnd() * a.length)];
const weighted = () => { const tot = PRIZES.reduce((s, p) => s + p[2], 0); let r = rnd() * tot; for (const p of PRIZES) { r -= p[2]; if (r <= 0) return p; } return PRIZES[0]; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------------- canvas ----------------
const W = 1080, H = 1935;
const cv = document.getElementById("c"); cv.width = W; cv.height = H; const ctx = cv.getContext("2d");
const mk = () => { const l = document.createElement("canvas"); l.width = W; l.height = H; return [l, l.getContext("2d")]; };
const [baseL, baseG] = mk(), [foilL, foil] = mk(), [silverL, silverG] = mk(), [goldL, goldG] = mk(), [dustL, dust] = mk(), [compL, comp] = mk();

function foilTexture(g, a, b) {
  const gr = g.createLinearGradient(0, 0, W * 0.6, H);
  for (let i = 0; i <= 14; i++) { const c = i % 2 ? b : a, m = i % 3 === 0 ? 0.85 : 1; gr.addColorStop(i / 14, `rgb(${c.map(v => Math.round(v * m)).join(",")})`); }
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (rnd() - .5) * 44, f = rnd() < .004 ? 70 : 0; d[i] += n + f; d[i+1] += n + f; d[i+2] += n + f; }
  g.putImageData(id, 0, 0);
}
foilTexture(silverG, [156,160,168], [226,228,233]);
foilTexture(goldG, [178,132,40], [242,214,130]);

// ---------------- game state ----------------
let T, G;   // current ticket art, current game
const serial = t => `${t.game}-${String(Math.floor(rnd() * 1e6)).padStart(6, "0")}-${String(Math.floor(rnd() * 300)).padStart(3, "0")}`;
function newGame() {
  T = pick(TICKETS);
  const lucky = shuffle(PLAIN).slice(0, 4), others = PLAIN.filter(s => !lucky.includes(s));
  // decide the outcome first, like a real print run: ~1 in 3 tickets wins, 1 in 20 hits the jackpot
  const r = rnd(), winCount = r < 0.05 ? 1 : r < 0.20 ? 1 : r < 0.30 ? 2 : r < 0.34 ? 3 : 0, jackpot = r < 0.05;
  const order = shuffle([...T.spots.keys()]), winners = new Set(order.slice(0, winCount));
  const spots = T.spots.map((_, i) => {
    const sym = winners.has(i) ? (jackpot && i === order[0] ? "CLVR" : pick(lucky)) : pick(others);
    return { sym, prize: weighted(), revealed: false, win: false, at: 0 };
  });
  G = { lucky, coins: lucky.map(s => ({ sym: s, revealed: false })), spots, serial: serial(T), done: false, doneAt: 0, total: null, born: performance.now() };
  buildBase(); buildFoil(); dust.clearRect(0, 0, W, H);
}
const rect = ([x, y, w, h], pad = 0) => ({ x: x - pad, y: y - pad, w: w + pad * 2, h: h + pad * 2 });

// printed layer: ticket art + the play symbols printed under the latex
function glyph(g, sym, cx, cy, size) {
  const im = SYMBOLS[sym], s = size / im.height;
  g.drawImage(im, cx - im.width * s / 2, cy - im.height * s / 2, im.width * s, im.height * s);
}
const [underL, under] = mk(), [labelL, labelG] = mk();
function buildBase() {
  const g = baseG; g.clearRect(0, 0, W, H); g.drawImage(T.img, 0, 0, W, H);
  // tickets whose art already printed prizes: paint them out with the panel colour
  if (T.coverPrinted) {
    const src = document.createElement("canvas"); src.width = W; src.height = H; const sg = src.getContext("2d"); sg.drawImage(T.img, 0, 0, W, H);
    T.spots.forEach(([x, y, w, h]) => { const py = y + h + 20, px = T.spots[0][0] - 18; const d = sg.getImageData(px, py, 1, 1).data;
      g.fillStyle = `rgb(${d[0]},${d[1]},${d[2]})`; g.fillRect(x - 32, y + h + 3, w + 64, 50); });
  }
  // serial number, new for every ticket
  const [sx, sy, sw, sh] = T.serial; g.fillStyle = "#fff"; g.fillRect(sx, sy, sw, sh);
  g.fillStyle = "#1a1a1a"; g.font = '400 ' + Math.round(sh * 0.54) + 'px "AzMono"'; g.textAlign = "left"; g.textBaseline = "middle"; g.fillText(G.serial, sx + 20, sy + sh / 2 + 2);
  g.textBaseline = "alphabetic";
  // printing under the latex: light play area + symbol, clipped to the exact spot shapes from the ticket
  under.clearRect(0, 0, W, H);
  // play area printed in the pale blue-grey of real tickets, with faint wavy security lines
  under.fillStyle = "#bfc8d6"; under.fillRect(0, 0, W, H);
  under.save(); under.strokeStyle = "rgba(70,120,190,.28)"; under.lineWidth = 1.3;
  for (let y0 = -40; y0 < H + 40; y0 += 26) { under.beginPath(); for (let x = 0; x <= W; x += 12) { const y = y0 + Math.sin(x / 70 + y0 / 50) * 9 + Math.sin(x / 23) * 2; x ? under.lineTo(x, y) : under.moveTo(x, y); } under.stroke(); }
  under.restore();
  const paint = (R, sym, f) => glyph(under, sym, R.x + R.w / 2, R.y + R.h / 2 + 1, Math.min(R.h, R.w * 0.8) * f);
  G.coins.forEach((c, i) => paint(rect(T.coins[i]), c.sym, 0.8));
  G.spots.forEach((s, i) => paint(rect(T.spots[i]), s.sym, 0.9));
  under.globalCompositeOperation = "destination-in"; under.drawImage(T.maskImg, 0, 0, W, H); under.globalCompositeOperation = "source-over";
  g.drawImage(underL, 0, 0);
  // prizes printed on the ticket, always visible
  labelG.clearRect(0, 0, W, H); labelG.textAlign = "center"; labelG.lineJoin = "round";
  G.spots.forEach((s, i) => {
    const R = rect(T.spots[i]), cx = R.x + R.w / 2, label = s.prize[0];
    let fs = T.insetLabels ? 24 : 32; labelG.font = fs + 'px "Lilita"';
    while (labelG.measureText(label).width > R.w + (T.insetLabels ? 0 : 8) && fs > 14) { fs -= 1; labelG.font = fs + 'px "Lilita"'; }
    const ly = T.insetLabels ? R.y + R.h - 6 : R.y + R.h + fs * 0.95;
    labelG.lineWidth = 7; labelG.strokeStyle = "#111"; labelG.strokeText(label, cx, ly); labelG.fillStyle = "#fff"; labelG.fillText(label, cx, ly);
  });
}

// ---------------- latex ----------------
let foilDirty = true;
function buildFoil() {
  foil.clearRect(0, 0, W, H);
  const lay = (R, src) => { foil.drawImage(src, R.x - 8, R.y - 8, R.w + 16, R.h + 16, R.x - 8, R.y - 8, R.w + 16, R.h + 16);
    foil.save(); foil.globalAlpha = 0.12; foil.fillStyle = "#000"; foil.font = '600 9px "AzMono"'; foil.textAlign = "center";
    for (let yy = R.y; yy < R.y + R.h + 10; yy += 11) foil.fillText("LUCKY ✦ LUCKY ✦ LUCKY", R.x + R.w / 2, yy); foil.restore(); };
  T.coins.forEach(c => lay(rect(c), goldL));
  T.spots.forEach(s => lay(rect(s), silverL));
  foil.globalCompositeOperation = "destination-in"; foil.drawImage(T.maskImg, 0, 0, W, H); foil.globalCompositeOperation = "source-over";
  foilDirty = true;
}
function crumbs(x, y, spread, n, col) {
  for (let i = 0; i < n; i++) {
    const a = rnd() * 6.283, d = spread * (0.6 + rnd()), px = x + Math.cos(a) * d, py = y + Math.sin(a) * d, r = 1 + rnd() * 2.4;
    dust.fillStyle = "rgba(0,0,0,.25)"; dust.beginPath(); dust.arc(px + .8, py + .8, r, 0, 7); dust.fill();
    dust.fillStyle = col; dust.beginPath(); dust.arc(px, py, r, 0, 7); dust.fill();
  }
}
function scratchLine(x0, y0, x1, y1) {
  const dist = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(1, Math.ceil(dist / 4));
  foil.save(); foil.globalCompositeOperation = "destination-out";
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t, r = 12 + rnd() * 6;
    foil.beginPath(); for (let k = 0; k < 9; k++) { const an = k / 9 * 6.283, rr = r * (0.72 + rnd() * 0.38); foil.lineTo(x + Math.cos(an) * rr, y + Math.sin(an) * rr); } foil.fill();
    if (rnd() < 0.06) crumbs(x, y, r + 4, 1, "#c9cbd0");
  }
  foil.restore(); foilDirty = true;
}
function ratio(R) {
  const d = foil.getImageData(R.x + R.w * .2, R.y + R.h * .2, R.w * .6, R.h * .6).data; let c = 0, n = 0;
  for (let i = 3; i < d.length; i += 4 * 5) { n++; if (d[i] < 40) c++; }
  return c / n;
}
function clearItem(R) { foil.save(); foil.globalCompositeOperation = "destination-out"; foil.fillRect(R.x - 5, R.y - 5, R.w + 10, R.h + 10); foil.restore(); foilDirty = true; }

// ---------------- matching ----------------
function evaluate() {
  const known = new Set(G.coins.filter(c => c.revealed).map(c => c.sym));
  G.spots.forEach(s => {
    if (!s.revealed || s.win) return;
    if (s.sym === "CLVR" || known.has(s.sym)) { s.win = true; s.at = performance.now(); s.sym === "CLVR" ? sfx.jackpot() : sfx.win(); }
  });
  if (!G.done && G.coins.every(c => c.revealed) && G.spots.every(s => s.revealed)) {
    G.done = true; G.doneAt = performance.now();
    const wins = G.spots.filter(s => s.win), cash = wins.filter(s => s.sym !== "CLVR").reduce((t, s) => t + s.prize[3], 0);
    const perks = wins.filter(s => s.sym !== "CLVR" && !s.prize[3]).map(s => s.prize[0]);
    const jack = wins.some(s => s.sym === "CLVR");
    G.total = { jack, cash, perks, any: wins.length > 0 };
    if (!G.total.any) sfx.lose();
  }
}
function checkAt(x, y) {
  T.coins.forEach((c, i) => { const R = rect(c); if (!G.coins[i].revealed && x > R.x - 10 && x < R.x + R.w + 10 && y > R.y - 10 && y < R.y + R.h + 10 && ratio(R) > 0.45) { G.coins[i].revealed = true; clearItem(R); sfx.ding(i); evaluate(); } });
  T.spots.forEach((s, i) => { const R = rect(s); if (!G.spots[i].revealed && x > R.x - 10 && x < R.x + R.w + 10 && y > R.y - 10 && y < R.y + R.h + 10 && ratio(R) > 0.45) { G.spots[i].revealed = true; clearItem(R); sfx.tick(); evaluate(); } });
}
function revealAll() {
  G.coins.forEach((c, i) => { if (!c.revealed) { c.revealed = true; clearItem(rect(T.coins[i])); } });
  G.spots.forEach((s, i) => { if (!s.revealed) { s.revealed = true; clearItem(rect(T.spots[i])); } });
  evaluate();
}

// ---------------- input ----------------
let last = null;
const toCanvas = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height }; };
cv.addEventListener("pointerdown", async e => { await audioReady(); last = toCanvas(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!last) return; const p = toCanvas(e); scratchLine(last.x, last.y, p.x, p.y); if (Math.hypot(p.x - last.x, p.y - last.y) > 10) sfx.scratch(); last = p; checkAt(p.x, p.y); });
const end = () => { last = null; }; cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);

// ---------------- autoplay: coins, then every spot, then the result, then a fresh ticket ----------------
const BPM = 112, BEAT = 60 / BPM;
const STEP = BEAT / 2, COIN_T = 0.3, SPOT_T = COIN_T + 4 * BEAT, END_T = SPOT_T + 20 * STEP, LOOP = END_T + 4 * BEAT;
let autoJobs = [], autoOn = false, autoStart = 0, lastAutoT = 0;
function planJobs() {
  autoJobs = [];
  T.coins.forEach((c, i) => autoJobs.push({ R: rect(c), start: COIN_T + i * BEAT, dur: BEAT * 0.8, done: 0 }));
  T.spots.forEach((s, i) => autoJobs.push({ R: rect(s), start: SPOT_T + i * STEP, dur: STEP * 0.95, done: 0 }));
  autoJobs.forEach(j => { const { x, y, w, h } = j.R, n = 3, pts = []; for (let i = 0; i <= n; i++) { const yy = y + 10 + (h - 20) * i / n; pts.push(i % 2 ? [x + w - 8, yy] : [x + 8, yy]); } j.pts = pts; });
}
let coin = null;
function runAuto() {
  coin = null; if (!autoOn) return;
  const t = Tone.Transport.seconds;
  if (t + 0.05 < lastAutoT) { newGame(); planJobs(); }
  lastAutoT = t;
  for (const j of autoJobs) {
    const p = (t - j.start) / j.dur; if (p <= 0) continue;
    const segs = j.pts.length - 1, upto = Math.min(segs, p * segs);
    while (j.done < Math.floor(upto)) { const a = j.pts[j.done], b = j.pts[j.done + 1]; scratchLine(a[0], a[1], b[0], b[1]); j.done++; if (j.done === segs) checkAt(j.R.x + j.R.w / 2, j.R.y + j.R.h / 2); }
    if (p < 1) { const i = Math.floor(upto), f = upto - i, a = j.pts[i], b = j.pts[Math.min(i + 1, segs)]; const cx = a[0] + (b[0] - a[0]) * f, cy = a[1] + (b[1] - a[1]) * f; scratchLine(a[0], a[1], cx, cy); coin = [cx, cy]; }
  }
}

// ---------------- audio ----------------
let audio = null; const sfx = { scratch() {}, ding() {}, tick() {}, win() {}, jackpot() {}, lose() {} };
async function audioReady() {
  await Tone.start(); if (audio) return;
  const out = new Tone.Gain(0.9).toDestination();
  const scr = new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.07, sustain: 0 } }); scr.chain(new Tone.Filter({ type: "bandpass", frequency: 2600, Q: 0.9 }), out); scr.volume.value = -9;
  const bell = new Tone.PolySynth(Tone.FMSynth, { harmonicity: 3.01, modulationIndex: 12, envelope: { attack: 0.002, decay: 0.5, sustain: 0, release: 0.6 }, modulationEnvelope: { attack: 0.002, decay: 0.2, sustain: 0 } }).connect(out); bell.volume.value = -13;
  const blip = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.06, sustain: 0 } }).connect(out); blip.volume.value = -18;
  const kick = new Tone.MembraneSynth({ octaves: 5, pitchDecay: 0.03, envelope: { decay: 0.3, sustain: 0 } }).connect(out); kick.volume.value = -6;
  const hat = new Tone.MetalSynth({ envelope: { attack: 0.001, decay: 0.04, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4200, octaves: 1.4 }).connect(out); hat.volume.value = -32;
  const bass = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.5, sustain: 0 } }).connect(out); bass.volume.value = -8;
  let ls = 0;
  sfx.scratch = () => { const n = Tone.now(); if (n - ls > 0.05) { scr.triggerAttackRelease(0.05, n); ls = n; } };
  sfx.ding = i => bell.triggerAttackRelease(["G5","A5","C6","D6"][i % 4], "8n", Tone.now(), 0.7);
  sfx.tick = () => blip.triggerAttackRelease("C6", "32n", Tone.now(), 0.5);
  sfx.win = () => { const n = Tone.now(); ["C6","E6","G6"].forEach((x, i) => bell.triggerAttackRelease(x, "16n", n + i * 0.06, 0.8)); };
  sfx.jackpot = () => { const n = Tone.now(); kick.triggerAttackRelease("C1", "8n", n); ["C5","E5","G5","C6","E6","G6","C7"].forEach((x, i) => bell.triggerAttackRelease(x, "16n", n + i * 0.08, 0.9)); bell.triggerAttackRelease(["C5","E5","G5","C6"], "2n", n + 0.6, 0.8); };
  sfx.lose = () => { const n = Tone.now(); bass.triggerAttackRelease("E2", "4n", n); bass.triggerAttackRelease("C2", "4n", n + 0.25); };
  const beats = Math.round(LOOP / BEAT);
  for (let b = 0; b < beats; b++) { Tone.Transport.schedule(t => kick.triggerAttackRelease("C1", "8n", t, b % 4 === 0 ? 0.9 : 0.45), b * BEAT); Tone.Transport.schedule(t => hat.triggerAttackRelease("32n", t, 0.6), b * BEAT + BEAT / 2); }
  Tone.Transport.bpm.value = BPM; Tone.Transport.loop = true; Tone.Transport.loopStart = 0; Tone.Transport.loopEnd = LOOP;
  audio = true;
}

// ---------------- render ----------------
function star(g, x, y, R, r, n) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r : R; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); }
function draw(now) {
  runAuto();
  const intro = Math.min(1, (now - G.born) / 350), slide = (1 - intro) * (1 - intro);
  ctx.fillStyle = "#151515"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(slide * W * 0.6, 0); ctx.rotate(slide * 0.08);
  ctx.drawImage(baseL, 0, 0);
  if (foilDirty) { comp.clearRect(0, 0, W, H); comp.save(); comp.shadowColor = "rgba(0,0,0,.38)"; comp.shadowBlur = 3; comp.shadowOffsetX = 1.5; comp.shadowOffsetY = 2.5; comp.drawImage(foilL, 0, 0); comp.restore(); foilDirty = false; }
  ctx.drawImage(compL, 0, 0); ctx.drawImage(dustL, 0, 0); ctx.drawImage(labelL, 0, 0);
  // win marks: a hand-drawn circle like players do with a pen
  G.spots.forEach((s, i) => {
    if (!s.win) return; const R = rect(T.spots[i]), k = Math.min(1, (now - s.at) / 300), jack = s.sym === "CLVR";
    ctx.save(); ctx.strokeStyle = jack ? "#ffd400" : "#e0001b"; ctx.lineWidth = jack ? 8 : 6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.ellipse(R.x + R.w / 2, R.y + R.h / 2, R.w / 2 + 9, R.h / 2 + 9, -0.08, -1.2, -1.2 + k * 6.6); ctx.stroke(); ctx.restore();
  });
  // result banner
  if (G.done && G.total) {
    const t = (now - G.doneAt) / 350, sc = Math.min(1, t) * (1 + 0.25 * Math.exp(-t * 3) * Math.cos(t * 8));
    ctx.save(); ctx.translate(W / 2, 1330); ctx.rotate(-0.06); ctx.scale(sc, sc);
    const { jack, cash, perks, any } = G.total;
    const head = jack ? "JACKPOT!" : any ? "WINNER!" : "NOT A WINNER", sub = jack ? "YOU FOUND THE CLOVER" : any ? [cash ? "$" + cash : "", ...perks].filter(Boolean).join(" + ") : "TRY AGAIN TOMORROW";
    star(ctx, 0, 0, 255, 192, 22); ctx.fillStyle = jack ? "#ffd400" : any ? "#fff23a" : "#ffffff"; ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = "#111"; ctx.stroke();
    ctx.fillStyle = "#111"; ctx.textAlign = "center"; ctx.font = (head.length > 8 ? 60 : 82) + 'px "Lilita"'; ctx.fillText(head, 0, 8);
    ctx.font = '800 ' + (sub.length > 22 ? 19 : 26) + 'px "Slab"'; ctx.fillText(sub, 0, 56);
    ctx.restore();
  }
  if (coin) {
    const [x, y] = coin;
    ctx.beginPath(); ctx.arc(x + 5, y + 6, 30, 0, 7); ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fill();
    const gr = ctx.createRadialGradient(x - 10, y - 10, 4, x, y, 30); gr.addColorStop(0, "#fff6b0"); gr.addColorStop(.6, "#e8b400"); gr.addColorStop(1, "#9a6a00");
    ctx.beginPath(); ctx.arc(x, y, 30, 0, 7); ctx.fillStyle = gr; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#111"; ctx.stroke();
    ctx.fillStyle = "#111"; ctx.font = '30px "Lilita"'; ctx.textAlign = "center"; ctx.fillText("¢", x, y + 11);
  }
  ctx.restore();
  requestAnimationFrame(draw);
}
newGame(); requestAnimationFrame(draw);

// ---------------- controls ----------------
const autoBtn = document.getElementById("auto"), recBtn = document.getElementById("rec"), status = document.getElementById("status");
document.getElementById("new").onclick = () => { stopAuto(); newGame(); };
document.getElementById("reveal").onclick = async () => { await audioReady(); revealAll(); };
async function startAuto() { await audioReady(); newGame(); planJobs(); lastAutoT = 0; autoOn = true; Tone.Transport.stop(); Tone.Transport.position = 0; Tone.Transport.start("+0.05"); autoBtn.textContent = "■ Stop"; }
function stopAuto() { autoOn = false; Tone.Transport.stop(); autoBtn.textContent = "▶ Autoplay"; }
autoBtn.onclick = () => autoOn ? stopAuto() : startAuto();
recBtn.onclick = async () => {
  await audioReady(); stopAuto();
  const dest = Tone.getContext().createMediaStreamDestination(); Tone.getDestination().connect(dest);
  const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...dest.stream.getAudioTracks()]);
  const types = ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm"];
  const rec = new MediaRecorder(stream, { mimeType: types.find(t => MediaRecorder.isTypeSupported(t)) || "", videoBitsPerSecond: 12e6 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { Tone.getDestination().disconnect(dest); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType })); a.download = "designer-lottery." + (rec.mimeType.includes("mp4") ? "mp4" : "webm"); a.click(); status.textContent = "saved"; recBtn.disabled = autoBtn.disabled = false; };
  recBtn.disabled = autoBtn.disabled = true; status.textContent = "recording…"; rec.start(); await startAuto();
  setTimeout(() => { rec.stop(); stopAuto(); }, LOOP * 1000 - 60);
};
})();
</script>
